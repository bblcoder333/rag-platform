name: RAG Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ragplatform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn python-dotenv \
            langchain langchain-community \
            pypdf sqlalchemy psycopg2-binary \
            pgvector pytest httpx requests

      - name: Initialize database
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/ragplatform
        run: python backend/db/database.py

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/ragplatform
        run: pytest backend/tests/ -v --tb=short