name: RAG Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ragplatform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn python-dotenv \
            langchain langchain-community \
            pypdf sqlalchemy psycopg2-binary \
            pgvector pytest httpx requests

      - name: Initialize database
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/ragplatform
        run: python backend/db/database.py

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/ragplatform
        run: pytest backend/ -v --tb=short

      - name: Check API starts correctly
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/ragplatform
        run: |
          uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          echo "API health check passed"