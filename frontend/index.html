<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RAG Platform</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent-dim: #1f6feb;
    --mono: 'SF Mono', 'Monaco', 'Consolas', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    font-family: var(--mono);
  }
  header h1::before {
    content: "› ";
    color: var(--accent);
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .status {
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #3fb950;
    flex-shrink: 0;
  }
  .dot.off { background: #f85149; }
  .upload-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-family: var(--mono);
    cursor: pointer;
  }
  .upload-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .upload-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #fileInput { display: none; }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  .empty {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
  }
  .empty .hint {
    font-family: var(--mono);
    font-size: 12px;
    margin-top: 8px;
    color: #555;
  }
  .msg {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 85%;
  }
  .msg.user {
    align-self: flex-end;
    align-items: flex-end;
  }
  .msg.bot, .msg.system {
    align-self: flex-start;
    align-items: flex-start;
  }
  .bubble {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.55;
  }
  .bubble p { margin: 0 0 8px 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 4px 0 8px 0; padding-left: 20px; }
  .bubble code {
    background: rgba(255,255,255,0.08);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 12.5px;
  }
  .bubble strong { color: #fff; }
  .msg.user .bubble {
    background: var(--accent-dim);
    color: white;
  }
  .msg.bot .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .msg.system .bubble {
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--text-dim);
    font-size: 12px;
    font-family: var(--mono);
  }
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 4px;
  }
  .meta {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
  }
  .chip {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--accent);
    background: rgba(88, 166, 255, 0.1);
    border: 1px solid rgba(88, 166, 255, 0.25);
    padding: 3px 8px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .chip:hover {
    background: rgba(88, 166, 255, 0.2);
  }
  .chip-detail {
    display: none;
    margin-top: 6px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
    line-height: 1.5;
    max-width: 100%;
  }
  .chip-detail.open { display: block; }
  .typing {
    display: flex;
    gap: 4px;
    padding: 10px 14px;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  footer {
    padding: 16px 24px 24px;
    border-top: 1px solid var(--border);
  }
  form {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--text-dim); }
  button[type="submit"] {
    background: var(--accent-dim);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  button[type="submit"]:hover { background: var(--accent); }
  button[type="submit"]:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1>rag-platform</h1>
  <div class="header-right">
    <input type="file" id="fileInput" accept=".pdf,.txt,.md" />
    <button class="upload-btn" id="uploadBtn">+ upload doc</button>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">checking...</span>
    </div>
  </div>
</header>

<main id="messages">
  <div class="empty" id="emptyState">
    Ask a question about your ingested documents
    <div class="hint">hybrid search → rerank → llama3.2</div>
  </div>
</main>

<footer>
  <form id="chatForm">
    <input type="text" id="input" placeholder="Ask something..." autocomplete="off" />
    <button type="submit" id="sendBtn">Ask</button>
  </form>
</footer>

<script>
const API_URL = "http://localhost:8000";
const messages = document.getElementById("messages");
const emptyState = document.getElementById("emptyState");
const form = document.getElementById("chatForm");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");
const uploadBtn = document.getElementById("uploadBtn");
const fileInput = document.getElementById("fileInput");

const STORAGE_KEY = "rag_chat_history";

// ---------- Simple markdown rendering ----------
function renderMarkdown(text) {
  let html = text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");

  const lines = html.split("\n");
  let out = [];
  let inList = false;
  for (const line of lines) {
    const bulletMatch = line.match(/^[\s]*[-*]\s+(.*)/);
    if (bulletMatch) {
      if (!inList) { out.push("<ul>"); inList = true; }
      out.push(`<li>${bulletMatch[1]}</li>`);
    } else {
      if (inList) { out.push("</ul>"); inList = false; }
      if (line.trim()) out.push(`<p>${line}</p>`);
    }
  }
  if (inList) out.push("</ul>");
  return out.join("");
}

// ---------- Persistence ----------
function saveHistory() {
  const html = messages.innerHTML;
  localStorage.setItem(STORAGE_KEY, html);
}

function loadHistory() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved && saved.trim()) {
    messages.innerHTML = saved;
    messages.scrollTop = messages.scrollHeight;
    // rebind chip click handlers after restoring from storage
    document.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => toggleChip(chip));
    });
  }
}

function clearHistory() {
  localStorage.removeItem(STORAGE_KEY);
}

// ---------- Health check ----------
async function checkHealth() {
  try {
    const res = await fetch(`${API_URL}/health`);
    if (res.ok) {
      statusDot.classList.remove("off");
      statusText.textContent = "connected";
    } else {
      throw new Error();
    }
  } catch {
    statusDot.classList.add("off");
    statusText.textContent = "backend offline";
  }
}
checkHealth();
setInterval(checkHealth, 10000);

// ---------- Message rendering ----------
function addMessage(role, content, isMarkdown = false) {
  if (emptyState) emptyState.remove();
  const msg = document.createElement("div");
  msg.className = `msg ${role}`;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (isMarkdown) {
    bubble.innerHTML = renderMarkdown(content);
  } else {
    bubble.textContent = content;
  }
  msg.appendChild(bubble);
  messages.appendChild(msg);
  messages.scrollTop = messages.scrollHeight;
  return msg;
}

let chipCounter = 0;

function addSourceChips(msgEl, sources, chunksUsed, scores) {
  const row = document.createElement("div");
  row.className = "meta-row";

  const meta = document.createElement("span");
  meta.className = "meta";
  meta.textContent = `${chunksUsed} chunks ·`;
  row.appendChild(meta);

  sources.forEach((source, i) => {
    chipCounter++;
    const chipId = `chip-detail-${chipCounter}`;
    const score = scores[i] !== undefined ? scores[i].toFixed(2) : "—";

    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = `${source} (${score})`;
    chip.dataset.target = chipId;

    row.appendChild(chip);

    const detail = document.createElement("div");
    detail.className = "chip-detail";
    detail.id = chipId;
    detail.textContent = `Source: ${source} — rerank score ${score}. Click chip to toggle this detail panel; full chunk text is logged server-side and viewable via /documents endpoint.`;
    msgEl.appendChild(detail);

    chip.addEventListener("click", () => toggleChip(chip));
  });

  msgEl.appendChild(row);
}

function toggleChip(chip) {
  const target = document.getElementById(chip.dataset.target);
  if (target) target.classList.toggle("open");
}

function showTyping() {
  const msg = document.createElement("div");
  msg.className = "msg bot";
  msg.id = "typingIndicator";
  const bubble = document.createElement("div");
  bubble.className = "bubble typing";
  bubble.innerHTML = "<span></span><span></span><span></span>";
  msg.appendChild(bubble);
  messages.appendChild(msg);
  messages.scrollTop = messages.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typingIndicator");
  if (el) el.remove();
}

// ---------- Chat submit ----------
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;

  addMessage("user", question);
  saveHistory();
  input.value = "";
  input.disabled = true;
  sendBtn.disabled = true;
  showTyping();

  try {
    const res = await fetch(`${API_URL}/ask`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, top_k: 5 })
    });

    if (!res.ok) throw new Error(`Status ${res.status}`);
    const data = await res.json();

    removeTyping();
    const botMsg = addMessage("bot", data.answer, true);

    const sources = data.sources || [];
    const scores = data.similarity_scores || [];
    addSourceChips(botMsg, sources, data.chunks_used, scores);

    saveHistory();

  } catch (err) {
    removeTyping();
    addMessage("bot", `Error: could not reach backend. Is it running on port 8000?`);
    saveHistory();
  } finally {
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }
});

// ---------- Upload ----------
uploadBtn.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  if (!file) return;

  uploadBtn.disabled = true;
  uploadBtn.textContent = "uploading...";
  addMessage("system", `Uploading ${file.name}...`);
  saveHistory();

  const formData = new FormData();
  formData.append("file", file);

  try {
    const res = await fetch(`${API_URL}/ingest`, {
      method: "POST",
      body: formData
    });
    if (!res.ok) throw new Error(`Status ${res.status}`);
    const data = await res.json();

    const chunks = data.result?.num_chunks ?? "?";
    addMessage("system", `Ingested ${file.name} — ${chunks} chunks created. You can now ask about it.`);
  } catch (err) {
    addMessage("system", `Upload failed for ${file.name}: ${err.message}`);
  } finally {
    saveHistory();
    uploadBtn.disabled = false;
    uploadBtn.textContent = "+ upload doc";
    fileInput.value = "";
  }
});

// ---------- Init ----------
loadHistory();
input.focus();
</script>

</body>
</html>
