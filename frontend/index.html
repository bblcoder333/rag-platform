<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RAG Platform</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent-dim: #1f6feb;
    --mono: 'SF Mono', 'Monaco', 'Consolas', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    font-family: var(--mono);
  }
  header h1::before {
    content: "› ";
    color: var(--accent);
  }
  .status {
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #3fb950;
  }
  .dot.off { background: #f85149; }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  .empty {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
  }
  .empty .hint {
    font-family: var(--mono);
    font-size: 12px;
    margin-top: 8px;
    color: #555;
  }
  .msg {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 85%;
  }
  .msg.user {
    align-self: flex-end;
    align-items: flex-end;
  }
  .msg.bot {
    align-self: flex-start;
    align-items: flex-start;
  }
  .bubble {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
  }
  .msg.user .bubble {
    background: var(--accent-dim);
    color: white;
  }
  .msg.bot .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .meta {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
    padding: 0 4px;
  }
  .meta a { color: var(--accent); text-decoration: none; }
  .typing {
    display: flex;
    gap: 4px;
    padding: 10px 14px;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  footer {
    padding: 16px 24px 24px;
    border-top: 1px solid var(--border);
  }
  form {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
  }
  input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--text-dim); }
  button {
    background: var(--accent-dim);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1>rag-platform</h1>
  <div class="status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">checking...</span>
  </div>
</header>

<main id="messages">
  <div class="empty" id="emptyState">
    Ask a question about your ingested documents
    <div class="hint">hybrid search → rerank → llama3.2</div>
  </div>
</main>

<footer>
  <form id="chatForm">
    <input id="input" type="text" placeholder="Ask something..." autocomplete="off" />
    <button type="submit" id="sendBtn">Ask</button>
  </form>
</footer>

<script>
const API_URL = "http://localhost:8000";
const messages = document.getElementById("messages");
const emptyState = document.getElementById("emptyState");
const form = document.getElementById("chatForm");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");

async function checkHealth() {
  try {
    const res = await fetch(`${API_URL}/health`);
    if (res.ok) {
      statusDot.classList.remove("off");
      statusText.textContent = "connected";
    } else {
      throw new Error();
    }
  } catch {
    statusDot.classList.add("off");
    statusText.textContent = "backend offline";
  }
}
checkHealth();
setInterval(checkHealth, 10000);

function addMessage(role, content) {
  if (emptyState) emptyState.remove();
  const msg = document.createElement("div");
  msg.className = `msg ${role}`;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = content;
  msg.appendChild(bubble);
  messages.appendChild(msg);
  messages.scrollTop = messages.scrollHeight;
  return msg;
}

function addMeta(msgEl, text) {
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.innerHTML = text;
  msgEl.appendChild(meta);
}

function showTyping() {
  const msg = document.createElement("div");
  msg.className = "msg bot";
  msg.id = "typingIndicator";
  const bubble = document.createElement("div");
  bubble.className = "bubble typing";
  bubble.innerHTML = "<span></span><span></span><span></span>";
  msg.appendChild(bubble);
  messages.appendChild(msg);
  messages.scrollTop = messages.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typingIndicator");
  if (el) el.remove();
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;

  addMessage("user", question);
  input.value = "";
  input.disabled = true;
  sendBtn.disabled = true;
  showTyping();

  try {
    const res = await fetch(`${API_URL}/ask`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, top_k: 5 })
    });

    if (!res.ok) throw new Error(`Status ${res.status}`);
    const data = await res.json();

    removeTyping();
    const botMsg = addMessage("bot", data.answer);

    const sources = data.sources?.join(", ") || "none";
    const scores = data.similarity_scores
      ?.map(s => s.toFixed(2))
      .join(", ") || "—";
    addMeta(botMsg, `${data.chunks_used} chunks · ${sources} · rerank scores: ${scores}`);
  } catch (err) {
    removeTyping();
    addMessage("bot", `Error: could not reach backend. Is it running on port 8000?`);
  } finally {
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }
});

input.focus();
</script>

</body>
</html>
