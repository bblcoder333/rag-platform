version: '3.8'

services:
  postgres:
    image: ankane/pgvector
    container_name: pgvector
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ragplatform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: rag-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/ragplatform
    depends_on:
      - postgres
    volumes:
      - ./docs:/app/docs

volumes:
  postgres_data: